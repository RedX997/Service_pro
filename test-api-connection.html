<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    <p>Testing connection to ServicePro backend API</p>
    
    <button onclick="testLocalAPI()">Test Local API (localhost:3000)</button>
    <button onclick="testProductionAPI()">Test Production API (Render)</button>
    <button onclick="testClients()">Test Clients Endpoint</button>
    <button onclick="testAppointments()">Test Appointments Endpoint</button>
    
    <div id="results"></div>

    <script>
        const LOCAL_API = 'http://localhost:3000/api';
        const PRODUCTION_API = 'https://servicepro-backend.onrender.com/api';
        
        function addResult(message, type = 'loading') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            return div;
        }
        
        function updateResult(element, message, type) {
            element.className = `test-result ${type}`;
            element.innerHTML = message;
        }
        
        async function testAPI(baseUrl, label) {
            const result = addResult(`Testing ${label}...`, 'loading');
            
            try {
                const response = await fetch(`${baseUrl}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    updateResult(result, `✅ ${label} - Health check passed: ${JSON.stringify(data)}`, 'success');
                    return true;
                } else {
                    updateResult(result, `❌ ${label} - Health check failed: ${response.status} ${response.statusText}`, 'error');
                    return false;
                }
            } catch (error) {
                updateResult(result, `❌ ${label} - Connection failed: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testEndpoint(baseUrl, endpoint, label) {
            const result = addResult(`Testing ${label}...`, 'loading');
            
            try {
                const response = await fetch(`${baseUrl}${endpoint}`);
                
                if (response.ok) {
                    const data = await response.json();
                    updateResult(result, `✅ ${label} - Success: Found ${Array.isArray(data) ? data.length : 'N/A'} items<br><pre>${JSON.stringify(data, null, 2).substring(0, 500)}${JSON.stringify(data, null, 2).length > 500 ? '...' : ''}</pre>`, 'success');
                    return data;
                } else {
                    const errorText = await response.text();
                    updateResult(result, `❌ ${label} - Failed: ${response.status} ${response.statusText}<br><pre>${errorText}</pre>`, 'error');
                    return null;
                }
            } catch (error) {
                updateResult(result, `❌ ${label} - Connection failed: ${error.message}`, 'error');
                return null;
            }
        }
        
        async function testLocalAPI() {
            await testAPI(LOCAL_API, 'Local API');
        }
        
        async function testProductionAPI() {
            await testAPI(PRODUCTION_API, 'Production API');
        }
        
        async function testClients() {
            // Try production first, then local
            let data = await testEndpoint(PRODUCTION_API, '/clients', 'Production Clients');
            if (!data) {
                data = await testEndpoint(LOCAL_API, '/clients', 'Local Clients');
            }
        }
        
        async function testAppointments() {
            // Try production first, then local
            let data = await testEndpoint(PRODUCTION_API, '/appointments', 'Production Appointments');
            if (!data) {
                data = await testEndpoint(LOCAL_API, '/appointments', 'Local Appointments');
            }
        }
        
        // Auto-test production API on load
        window.onload = () => {
            testProductionAPI();
        };
    </script>
</body>
</html>
