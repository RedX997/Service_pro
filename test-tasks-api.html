<!DOCTYPE html>
<html>
<head>
    <title>Test Tasks API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .warning { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Test Tasks API</h1>
+    
    <div class="warning">
        <strong>⚠️ CORS Notice:</strong> If you're opening this file directly (file://), you may get CORS errors.
        <br>To fix: Run a local server or test from the deployed app.
    </div>
    
    <div>
        <button onclick="testBackendHealth()">1. Test Backend Health</button>
        <button onclick="testGetTodayTasks()">2. Get Today's Tasks</button>
        <button onclick="testCreateTask()">3. Create Test Task</button>
        <button onclick="testGetAllTasks()">4. Get All Tasks</button>
    </div>
    
    <pre id="output">Click a button to test the API...</pre>

    <script>
        const API_URL = 'https://servicepro-backend.onrender.com/api';
        const BACKEND_URL = 'https://servicepro-backend.onrender.com';
        const output = document.getElementById('output');

        async function testBackendHealth() {
            try {
                output.textContent = 'Testing backend health...';
                const response = await fetch(`${BACKEND_URL}/health`);
                const data = await response.json();
                output.textContent = '✅ Backend is healthy!\n\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = '❌ Error: ' + error.message + '\n\nThis might be a CORS issue if testing from file://';
            }
        }

        async function testGetTodayTasks() {
            try {
                output.textContent = 'Fetching today\'s tasks...';
                const response = await fetch(`${API_URL}/tasks/today`);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        async function testGetAllTasks() {
            try {
                output.textContent = 'Fetching all tasks...';
                const response = await fetch(`${API_URL}/tasks`);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        async function testCreateTask() {
            try {
                output.textContent = 'Creating test task...';
                
                // Create a task due today
                const today = new Date();
                today.setHours(14, 0, 0, 0); // 2 PM today
                
                const response = await fetch(`${API_URL}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: 'Test Task - Follow up with client',
                        description: 'Call client to discuss project requirements',
                        priority: 'high',
                        dueDate: today.toISOString(),
                        assignedTo: 'current-user-id' // Will use first employee
                    })
                });
                
                const data = await response.json();
                output.textContent = 'Task created:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
